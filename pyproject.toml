[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "dividend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "openai>=1,<3",
    "tiktoken>=0.8,<1",
    "paypal @ git+https://github.com/context-plugins/paypal-python-sdk.git@143e57f2a3729d7df3727386b8c9ddf023d9a5df",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dividend", "dividend.*"]
exclude = ["day1", "day1.*", "data", "data.*", "tests", "tests.*"]

[tool.setuptools.package-data]
dividend = ["data/*.tsv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
