services:
  - type: web
    name: dividend
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: dividend-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/dividend.db
      - key: PAYMENTS_MODE
        value: fake
      - key: PAYPAL_ENV
        value: sandbox
      - key: ENRICH_MODE
        value: fixtures
      - key: DEMO_SEED_ON_BOOT
        value: "true"
      - key: MODAL_ENDPOINT_URL
        value: https://asthorat7-pune--ep-deepseek-v4-1-flash-1017-server.us-west.modal.direct/v1
      - key: MODAL_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash-1017
      - key: MODAL_PROXY_TOKEN_ID
        sync: false
      - key: MODAL_PROXY_TOKEN_SECRET
        sync: false
      - key: LLM_LIVE_ENABLED
        value: "false"
      - key: LLM_KILL_SWITCH
        value: "true"
