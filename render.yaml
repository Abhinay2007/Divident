services:
  - type: web
    name: dividend
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: dividend-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/dividend.db
      - key: PAYMENTS_MODE
        value: fake
      - key: PAYPAL_ENV
        value: sandbox
      - key: ENRICH_MODE
        value: fixtures
      - key: DEMO_SEED_ON_BOOT
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_LIVE_ENABLED
        value: "false"
      - key: LLM_KILL_SWITCH
        value: "true"
      - key: LLM_MAX_SOURCES_PER_SESSION
        value: "5"
      - key: LLM_MAX_CALLS_PER_HOUR
        value: "100"
