services:
  dividend:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in the shell or ignored .env file}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DATABASE_URL: sqlite:////data/dividend.db
      DEMO_SEED_ON_BOOT: ${DEMO_SEED_ON_BOOT:-true}
      PAYMENTS_MODE: paypal
      PAYPAL_ENV: sandbox
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:?Set PAYPAL_CLIENT_ID in the ignored .env file}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:?Set PAYPAL_CLIENT_SECRET in the ignored .env file}
      ENRICH_MODE: ${ENRICH_MODE:-fixtures}
      UDD_DSN: ${UDD_DSN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      LLM_LIVE_ENABLED: "false"
      LLM_KILL_SWITCH: "true"
      MODAL_ENDPOINT_URL: ${MODAL_ENDPOINT_URL:-https://asthorat7-pune--ep-deepseek-v4-1-flash-1017-server.us-west.modal.direct/v1}
      MODAL_MODEL: ${MODAL_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash-1017}
      MODAL_PROXY_TOKEN_ID: ${MODAL_PROXY_TOKEN_ID:-}
      MODAL_PROXY_TOKEN_SECRET: ${MODAL_PROXY_TOKEN_SECRET:-}
    volumes:
      - dividend-local-test-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  dividend-local-test-data:
    name: dividend-local-test-data
